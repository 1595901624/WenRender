[package]
name = "wenrender"
version = "0.1.0"
description = "A Markdown editor for WeChat articles"
authors = ["WenRender"]
edition = "2021"

[lib]
name = "wenrender_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
